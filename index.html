<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modal Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f5f5f5;
        }

        .open-modal-btn {
            padding: 12px 24px;
            font-size: 16px;
            background-color: #4f46e5;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        .open-modal-btn:hover {
            background-color: #4338ca;
            transform: translateY(-1px);
        }

        .open-modal-btn:active {
            transform: translateY(0);
        }

        dialog {
            border: none;
            border-radius: 12px;
            padding: 0;
            max-width: 480px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: modal-slide-in 0.3s ease-out;
        }

        dialog::backdrop {
            background-color: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            animation: backdrop-fade-in 0.3s ease-out;
        }

        @keyframes modal-slide-in {
            from {
                opacity: 0;
                transform: translateY(-20px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes backdrop-fade-in {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 24px;
            border-bottom: 1px solid #e5e7eb;
        }

        .modal-header h2 {
            font-size: 18px;
            font-weight: 600;
            color: #111827;
        }

        .close-btn {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: none;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 20px;
            color: #6b7280;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        .close-btn:hover {
            background-color: #f3f4f6;
            color: #111827;
        }

        .modal-body {
            padding: 24px;
        }

        .modal-body p {
            color: #4b5563;
            line-height: 1.6;
            font-size: 15px;
        }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            padding: 16px 24px;
            border-top: 1px solid #e5e7eb;
        }

        .modal-footer button {
            padding: 8px 20px;
            font-size: 14px;
            border-radius: 6px;
            cursor: pointer;
            border: 1px solid #d1d5db;
            background-color: white;
            color: #374151;
            transition: background-color 0.2s ease;
        }

        .modal-footer button:hover {
            background-color: #f9fafb;
        }
    </style>
</head>
<body>
    <button class="open-modal-btn" id="openModalBtn">Open Modal</button>

    <dialog id="modalDialog" role="dialog" aria-labelledby="modalTitle">
        <div class="modal-header">
            <h2 id="modalTitle">Modal Dialog</h2>
            <button class="close-btn" id="closeModalBtn" aria-label="Close modal">&times;</button>
        </div>
        <div class="modal-body">
            <p>This is a modal dialog that can be opened by clicking the button. You can close it by clicking the close button, pressing the Escape key, or clicking outside the modal.</p>
        </div>
        <div class="modal-footer">
            <button id="dialogCloseBtn">Close</button>
        </div>
    </dialog>

    <script>
        const openBtn = document.getElementById('openModalBtn');
        const modal = document.getElementById('modalDialog');
        const closeBtn = document.getElementById('closeModalBtn');
        const dialogCloseBtn = document.getElementById('dialogCloseBtn');

        openBtn.addEventListener('click', () => {
            modal.showModal();
        });

        closeBtn.addEventListener('click', () => {
            modal.close();
        });

        dialogCloseBtn.addEventListener('click', () => {
            modal.close();
        });

        // Close modal when clicking on the backdrop (outside the dialog)
        modal.addEventListener('click', (event) => {
            if (event.target === modal) {
                modal.close();
            }
        });

        // Close modal on Escape key (native behavior for <dialog>, but we add explicit handling)
        modal.addEventListener('keydown', (event) => {
            if (event.key === 'Escape') {
                modal.close();
            }
        });
    </script>
</body>
</html>
