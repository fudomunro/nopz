[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nopz"
version = "0.1.0"
description = "Enforce regulations on a codebase using AI agents with separated validation and action."
authors = [
    {name = "Alec"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "llm>=0.29",
    "llm-gemini>=0.29",
    "openai",
    "pyyaml",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[project.scripts]
nopz = "nopz.cli:main"

[tool.coverage.run]
omit = [
    "nopz/test_llm_*.py",
]

[tool.setuptools.packages.find]
include = ["nopz", "nopz.*"]

[tool.setuptools.package-data]
nopz = ["regulation_guidelines.yaml"]
