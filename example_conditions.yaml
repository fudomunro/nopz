name: "Initial Setup Conditions"
description: "Basic conditions to verify the NOPZ project structure."
default_agent: "gemini"

conditions:
  - "A README.md file must exist in the root directory."
  - "The README.md file must contain a section titled 'Number One Point Zero (NOPZ)'."
  - "A requirements.txt file must exist in the root directory."
  - "The requirements.txt file must include the 'google-generativeai' dependency."
  - "There must be a main.py file that implements a basic CLI using argparse."
